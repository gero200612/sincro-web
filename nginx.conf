# Sin esto el navegador se guarda estilo.css viejo y lo mezcla con el html nuevo despues de cada deploy.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # html y css: siempre preguntan si cambiaron (responde 304 si no)
  location ~* \.(html|css)$ { add_header Cache-Control "no-cache"; }
  location = / { add_header Cache-Control "no-cache"; }

  # imagenes: una semana
  location ~* \.(webp|jpg|png)$ { add_header Cache-Control "public, max-age=604800"; }
}
